name: Release

on:
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: 'Existing tag to rebuild and publish after an interrupted release'
        type: string
        required: false
      replace_existing:
        description: 'Replace the existing release bundle after verification'
        type: boolean
        default: false
      send_fcm:
        description: 'Send FCM push notification'
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_tag == ''
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Require signing key
        env:
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: test -n "$MORPHE_SIGNING_KEY"

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

  recover-release:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_tag != ''
    name: Recover release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$REPLACE" != true ]]; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
        env:
          TAG: ${{ inputs.recovery_tag }}
          REPLACE: ${{ inputs.replace_existing }}
          GH_TOKEN: ${{ github.token }}
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recovery_tag }}
      - name: Install fork public key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/morphe-signing.pub?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw+json' > morphe-signing.pub
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          test -n "$MORPHE_SIGNING_KEY"
          ./gradlew generatePatchesList
          ./gradlew :patches:buildAndroid
      - name: Verify bundle signature
        env:
          TAG: ${{ inputs.recovery_tag }}
        run: |
          python3 -m pip install cryptography
          python3 -c 'import base64, hashlib, pathlib, zipfile; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; p = pathlib.Path("patches/build/libs/patches-" + __import__("os").environ["TAG"][1:] + ".mpp"); data = p.read_bytes(); comment = zipfile.ZipFile(p).comment; magic, key, sig = comment.split(); assert magic == b"MorpheSig1" and key.decode() == pathlib.Path("morphe-signing.pub").read_text().strip(); unsigned = data[:-len(comment)-2] + b"\x00\x00"; Ed25519PublicKey.from_public_bytes(base64.b64decode(key)).verify(base64.b64decode(sig), magic + hashlib.sha256(unsigned).digest()); print("Bundle signature verified")'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.recovery_tag }}
          REPLACE: ${{ inputs.replace_existing }}
        run: |
          bundle="patches/build/libs/patches-${TAG#v}.mpp"
          if [[ "$REPLACE" == true ]]; then
            gh release upload "$TAG" "$bundle" --repo "$GITHUB_REPOSITORY" --clobber
          else
            python3 -c 'import json; open("release-notes.txt", "w", encoding="utf-8").write(json.load(open("patches-bundle.json", encoding="utf-8"))["description"])'
            gh release create "$TAG" "$bundle" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.txt
          fi
