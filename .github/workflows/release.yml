name: Release

on:
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: 'Existing tag to rebuild and publish after an interrupted release'
        type: string
        required: false
      send_fcm:
        description: 'Send FCM push notification'
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_tag == ''
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

  recover-release:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_tag != ''
    name: Recover release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
        env:
          TAG: ${{ inputs.recovery_tag }}
          GH_TOKEN: ${{ github.token }}
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recovery_tag }}
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build patch bundle
        run: ./gradlew generatePatchesList
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.recovery_tag }}
        run: |
          python3 -c 'import json; open("release-notes.txt", "w", encoding="utf-8").write(json.load(open("patches-bundle.json", encoding="utf-8"))["description"])'
          gh release create "$TAG" patches/build/libs/patches-*.mpp --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.txt
